<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mushaf Hifz — Alat Bantu Hafalan Qur'an</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400..700&family=Lateef:wght@400..700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EA;
    --paper-edge:#F1E7CE;
    --ink:#20281F;
    --ink-soft:#57614F;
    --gold:#A9822E;
    --gold-soft:#C9A64B;
    --green-deep:#163527;
    --green-mid:#204E39;
    --rubric:#8E3A2C;
    --veil:#E7DEC2;
    --sidebar-w:300px;
    --ayah-font:'Amiri Quran';
    --ayah-size:26px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 800px at 15% -10%, #2a4235 0%, transparent 60%),
      linear-gradient(180deg,#132119 0%, #0E1A14 100%);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  header.topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 18px;
    background:linear-gradient(180deg,#173626,#122a1d);
    border-bottom:1px solid #0a1610;
    color:#EFE6C9;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-right:auto;
  }
  .brand .ar{
    font-family:'Amiri Quran',serif;
    font-size:22px;
    color:var(--gold-soft);
    line-height:1;
  }
  .brand .lat{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:15px;
    letter-spacing:.03em;
    color:#D9CFA6;
  }
  button.chip{
    background:transparent;
    border:1px solid #3c5947;
    color:#E8E0C0;
    padding:7px 13px;
    border-radius:999px;
    font-size:13px;
    font-family:'Work Sans',sans-serif;
    cursor:pointer;
    transition:background .15s,border-color .15s;
    white-space:nowrap;
  }
  button.chip:hover{ background:#24463482; border-color:var(--gold-soft); }
  button.chip:disabled{ opacity:.35; cursor:not-allowed; }
  button.chip.primary{ border-color:var(--gold-soft); color:var(--gold-soft); }

  .page-jump{
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:#cfc79f;
  }
  .page-jump input{
    width:58px;
    background:#0f2018;
    border:1px solid #3c5947;
    color:#EFE6C9;
    border-radius:6px;
    padding:6px 8px;
    font-size:13px;
    text-align:center;
  }

  .font-settings{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:12.5px;
    color:#cfc79f;
  }
  .font-settings label{
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .font-settings select{
    background:#0f2018;
    border:1px solid #3c5947;
    color:#EFE6C9;
    border-radius:6px;
    padding:5px 6px;
    font-size:12.5px;
  }
  .font-settings input[type="range"]{
    width:90px;
    accent-color:var(--gold-soft);
  }
  .font-settings .size-label{
    width:34px;
    display:inline-block;
    color:#EFE6C9;
  }

  /* ---------- Layout ---------- */
  .shell{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* ---------- Sidebar ---------- */
  aside.sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:#0f2018;
    border-right:1px solid #0a1610;
    display:flex;
    flex-direction:column;
    transition:margin-left .25s ease;
    color:#E8E0C0;
  }
  .shell.collapsed aside.sidebar{ margin-left:calc(-1 * var(--sidebar-w)); }
  .sidebar-head{
    padding:14px 14px 10px;
    border-bottom:1px solid #1c3327;
  }
  .sidebar-head input{
    width:100%;
    padding:9px 11px;
    border-radius:8px;
    border:1px solid #345342;
    background:#132a1e;
    color:#EFE6C9;
    font-size:14px;
  }
  .sidebar-head input::placeholder{ color:#7f8f7c; }
  .surah-list{
    flex:1;
    overflow-y:auto;
    padding:6px 0;
  }
  .surah-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 14px;
    cursor:pointer;
    border-left:3px solid transparent;
  }
  .surah-item:hover{ background:#16301f; }
  .surah-item.active{ background:#1b3a25; border-left-color:var(--gold-soft); }
  .surah-num{
    width:26px; height:26px;
    border:1px solid var(--gold-soft);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px; color:var(--gold-soft); flex-shrink:0;
  }
  .surah-info{ flex:1; min-width:0; }
  .surah-info .name-ar{ font-family:'Amiri Quran',serif; font-size:17px; color:#F1E9C8; }
  .surah-info .name-lat{ font-size:11px; color:#9fae97; display:flex; gap:6px; align-items:center; }
  .badge{
    font-size:9.5px;
    padding:1px 6px;
    border-radius:999px;
    border:1px solid #4a6656;
    color:#b9c7ae;
    letter-spacing:.03em;
  }

  /* ---------- Reader ---------- */
  main.reader{
    flex:1;
    min-width:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:34px 16px 60px;
  }
  .page-toolbar{
    width:100%;
    max-width:760px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    color:#cbd8c2;
    font-size:13px;
  }
  .page-toolbar .status{ color:#8ea184; }

  .mushaf-page{
    position:relative;
    width:100%;
    max-width:760px;
    min-height:70vh;
    flex-shrink:0;
    background:
      radial-gradient(circle at 50% 0%, #fffdf6 0%, var(--paper) 40%);
    border:1px solid var(--gold);
    border-radius:4px;
    box-shadow:
      0 0 0 1px #0000001a,
      0 24px 60px -20px #000000aa,
      inset 0 0 0 8px var(--paper),
      inset 0 0 0 9px var(--gold-soft),
      inset 0 0 0 13px var(--paper);
    padding:46px 40px 54px;
    overflow:hidden;
  }
  .mushaf-page::before{
    content:"";
    position:absolute; inset:16px;
    border:1px solid var(--gold-soft);
    border-radius:2px;
    pointer-events:none;
    opacity:.55;
  }

  .surah-banner{
    margin:6px auto 22px;
    max-width:520px;
    text-align:center;
    padding:14px 18px 16px;
    position:relative;
  }
  .surah-banner::before,.surah-banner::after{
    content:"";
    display:block;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:0 auto 10px;
    width:70%;
  }
  .surah-banner::after{ margin:10px auto 0; }
  .surah-banner .name{
    font-family:'Amiri Quran',serif;
    font-size:30px;
    color:var(--green-deep);
  }
  .surah-banner .meta{
    font-family:'Work Sans',sans-serif;
    font-size:11.5px;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .surah-banner .meta .badge{
    border-color:var(--gold);
    color:var(--rubric);
  }
  .basmalah{
    text-align:center;
    font-family:'Amiri Quran',serif;
    font-size:24px;
    color:var(--ink);
    margin:4px 0 20px;
  }

  .ayat-flow{
    direction:rtl;
    text-align:justify;
    font-family:var(--ayah-font), 'Amiri Quran', serif;
    font-size:var(--ayah-size);
    line-height:2.35;
    color:var(--ink);
    max-width:100%;
    overflow-wrap:break-word;
    word-break:normal;
  }
  .word{
    cursor:pointer;
    filter:blur(7px);
    opacity:.5;
    transition:filter .22s ease, opacity .22s ease, background .2s ease;
    border-radius:5px;
    padding:1px 3px;
    display:inline-block;
  }
  .word.revealed{
    filter:blur(0);
    opacity:1;
  }
  .word:hover{ background:#00000008; }
  .ayah-group .num{
    font-family:'Work Sans',sans-serif;
    font-size:0.5em;
    color:var(--gold);
    border:1px solid var(--gold);
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:1.5em;height:1.5em;
    margin:0 3px;
    vertical-align:middle;
    background:#fffef9;
  }
  .sajda-tag{
    display:inline-block;
    font-family:'Work Sans',sans-serif;
    font-size:10px;
    color:var(--rubric);
    border:1px solid var(--rubric);
    border-radius:4px;
    padding:0 5px;
    margin:0 4px;
    direction:ltr;
    vertical-align:middle;
  }

  .page-number{
    text-align:center;
    margin-top:26px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
  }

  .reveal-controls{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:18px;
  }
  .reveal-controls button{
    background:#fffef9;
    border:1px solid var(--gold);
    color:var(--green-deep);
    padding:7px 14px;
    border-radius:999px;
    font-size:12.5px;
    cursor:pointer;
  }
  .reveal-controls button:hover{ background:var(--veil); }

  .hint{
    max-width:760px;
    width:100%;
    text-align:center;
    color:#93a389;
    font-size:12px;
    margin-top:16px;
  }
  .hint kbd{
    background:#122a1d;
    border:1px solid #3c5947;
    border-radius:4px;
    padding:1px 6px;
    color:#EFE6C9;
    font-family:'Work Sans',sans-serif;
  }

  /* ---------- Loading / error ---------- */
  .center-screen{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    color:#cfd8c6;
    text-align:center;
    padding:40px;
  }
  .spinner{
    width:34px;height:34px;
    border-radius:50%;
    border:3px solid #3c5947;
    border-top-color:var(--gold-soft);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .center-screen .ar{ font-family:'Amiri Quran',serif; font-size:22px; color:var(--gold-soft); }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#3c5947; border-radius:6px; }

  @media (max-width:760px){
    aside.sidebar{ position:fixed; top:0; bottom:0; left:0; z-index:20; height:100%; }
    .shell{ position:relative; }
    .shell:not(.collapsed) main.reader{ filter:brightness(.4); pointer-events:none; }
    .mushaf-page{ padding:30px 20px 38px; }
    .surah-banner .name{ font-size:24px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="chip" id="toggleSidebar" title="Daftar surah">☰ Surah</button>
  <div class="brand">
    <span class="ar">مُصْحَفُ الْحِفْظ</span>
    <span class="lat">Mushaf Hifz</span>
  </div>
  <div class="font-settings">
    <label>Font ayat:
      <select id="fontSelect">
        <option value="'Amiri Quran'">Amiri Quran</option>
        <option value="'Scheherazade New'">Scheherazade New</option>
        <option value="'Noto Naskh Arabic'">Noto Naskh Arabic</option>
        <option value="'Lateef'">Lateef</option>
      </select>
    </label>
    <label>Ukuran:
      <input type="range" id="fontSize" min="18" max="42" step="1" value="26">
      <span class="size-label" id="fontSizeLabel">26px</span>
    </label>
  </div>
  <div class="page-jump">
    <span>Halaman</span>
    <input type="number" id="pageInput" min="1" max="604" value="1">
    <span>/ 604</span>
    <button class="chip" id="goPage">Pergi</button>
  </div>
  <button class="chip" id="prevPage">‹ Sebelumnya</button>
  <button class="chip" id="nextPage">Berikutnya ›</button>
</header>

<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <input type="text" id="surahSearch" placeholder="Cari surah… (nama, nomor)">
    </div>
    <div class="surah-list" id="surahList"></div>
  </aside>

  <main class="reader" id="reader">
    <div class="center-screen" id="loadingScreen">
      <div class="spinner"></div>
      <div class="ar">جَارٍ التَحْمِيل…</div>
      <div>Memuat teks mushaf 604 halaman dari sumber Al-Qur'an online…</div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  const SURAH_API = "https://api.alquran.cloud/v1/surah";
  const QURAN_API = "https://api.alquran.cloud/v1/quran/quran-uthmani";
  const TOTAL_PAGES = 604;
  const AR_DIGITS = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  const AYAH_END_MARK = "\u06DD"; // Arabic end of ayah ornament, if already embedded in source text
  const BASMALAH = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";

  function toArabicDigits(n){
    return String(n).split("").map(function(d){
      return /\d/.test(d) ? AR_DIGITS[+d] : d;
    }).join("");
  }

  // ---------------- state ----------------
  var surahs = [];              // [{number,name,englishName,englishNameTranslation,revelationType,numberOfAyahs, firstPage}]
  var pages = {};               // pageNumber -> [ayahEntry]
  var currentPage = 1;
  var revealedWords = Object.create(null); // wordId -> true

  var reader = document.getElementById("reader");
  var shell = document.getElementById("shell");

  // ---------------- data loading ----------------
  function loadData(){
    Promise.all([
      fetch(SURAH_API).then(function(r){ return r.json(); }),
      fetch(QURAN_API).then(function(r){ return r.json(); })
    ]).then(function(results){
      var surahMeta = results[0].data; // array of 114
      var quranData = results[1].data.surahs; // array of 114 with ayahs[]

      var metaByNumber = {};
      surahMeta.forEach(function(s){ metaByNumber[s.number] = s; });

      quranData.forEach(function(surah){
        var meta = metaByNumber[surah.number] || surah;
        var record = {
          number: surah.number,
          name: meta.name,
          englishName: meta.englishName,
          englishNameTranslation: meta.englishNameTranslation,
          revelationType: meta.revelationType,
          numberOfAyahs: meta.numberOfAyahs,
          firstPage: null
        };
        surahs.push(record);

        surah.ayahs.forEach(function(ayah){
          var pageNo = ayah.page;
          if (!pages[pageNo]) pages[pageNo] = [];
          var entry = {
            surahNumber: surah.number,
            surahName: meta.name,
            revelationType: meta.revelationType,
            numberOfAyahsInSurah: meta.numberOfAyahs,
            numberInSurah: ayah.numberInSurah,
            globalNumber: ayah.number,
            text: ayah.text,
            sajda: !!ayah.sajda
          };
          pages[pageNo].push(entry);
          if (record.firstPage === null) record.firstPage = pageNo;
        });
      });

      surahs.sort(function(a,b){ return a.number - b.number; });

      renderSidebar(surahs);
      buildReaderShell();
      renderPage(1);
    }).catch(function(err){
      showError(err);
    });
  }

  function showError(err){
    reader.innerHTML =
      '<div class="center-screen">' +
        '<div class="ar">تَعَذَّرَ التَحْمِيل</div>' +
        '<div>Gagal memuat teks mushaf. Pastikan perangkat terhubung ke internet ' +
        '(alat ini mengambil teks Al-Qur\'an dari api.alquran.cloud saat dibuka).</div>' +
        '<button class="chip primary" id="retryBtn">Coba lagi</button>' +
      '</div>';
    document.getElementById("retryBtn").addEventListener("click", function(){
      reader.innerHTML =
        '<div class="center-screen">' +
          '<div class="spinner"></div>' +
          '<div class="ar">جَارٍ التَحْمِيل…</div>' +
        '</div>';
      loadData();
    });
    console.error(err);
  }

  // ---------------- sidebar ----------------
  function renderSidebar(list){
    var container = document.getElementById("surahList");
    container.innerHTML = "";
    list.forEach(function(s){
      var item = document.createElement("div");
      item.className = "surah-item";
      item.dataset.number = s.number;
      item.dataset.search = (s.number + " " + s.name + " " + s.englishName + " " + s.englishNameTranslation).toLowerCase();
      item.innerHTML =
        '<div class="surah-num">' + s.number + '</div>' +
        '<div class="surah-info">' +
          '<div class="name-ar">' + s.name + '</div>' +
          '<div class="name-lat">' +
            '<span>' + s.englishName + '</span>' +
            '<span class="badge">' + (s.revelationType === "Meccan" ? "Makkiyah" : "Madaniyah") + '</span>' +
          '</div>' +
        '</div>';
      item.addEventListener("click", function(){
        goToPage(s.firstPage);
        if (window.innerWidth <= 760) shell.classList.add("collapsed");
      });
      container.appendChild(item);
    });
  }

  document.getElementById("surahSearch").addEventListener("input", function(e){
    var q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".surah-item").forEach(function(el){
      el.style.display = el.dataset.search.indexOf(q) === -1 ? "none" : "flex";
    });
  });

  function highlightActiveSurah(surahNumber){
    document.querySelectorAll(".surah-item").forEach(function(el){
      el.classList.toggle("active", +el.dataset.number === surahNumber);
    });
  }

  // ---------------- reader shell ----------------
  function buildReaderShell(){
    reader.innerHTML =
      '<div class="page-toolbar">' +
        '<span id="pageStatus" class="status"></span>' +
        '<span id="surahStatus"></span>' +
      '</div>' +
      '<div class="mushaf-page" id="mushafPage"></div>' +
      '<div class="reveal-controls">' +
        '<button id="revealAll">Tampilkan semua kata</button>' +
        '<button id="hideAll">Sembunyikan semua kata</button>' +
      '</div>' +
      '<div class="hint">' +
        'Klik sebuah kata untuk menampilkan/menyembunyikannya &middot; ' +
        'tekan <kbd>Spasi</kbd> untuk menampilkan kata berikutnya secara berurutan &middot; ' +
        '<kbd>Backspace</kbd> untuk membatalkan kata terakhir yang ditampilkan' +
      '</div>';

    document.getElementById("revealAll").addEventListener("click", function(){
      getPageWordIds(currentPage).forEach(function(id){ revealedWords[id] = true; });
      renderPage(currentPage, true);
    });
    document.getElementById("hideAll").addEventListener("click", function(){
      getPageWordIds(currentPage).forEach(function(id){ delete revealedWords[id]; });
      renderPage(currentPage, true);
    });
  }

  function getPageWordIds(pageNo){
    var ids = [];
    (pages[pageNo] || []).forEach(function(a){
      splitWords(a.text).forEach(function(w, idx){ ids.push(a.globalNumber + "_" + idx); });
    });
    return ids;
  }

  function splitWords(text){
    return text.split(/\s+/).filter(Boolean);
  }

  // ---------------- page rendering ----------------
  function renderPage(pageNo, skipHistoryTrack){
    if (pageNo < 1 || pageNo > TOTAL_PAGES) return;
    currentPage = pageNo;
    var entries = pages[pageNo] || [];
    var container = document.getElementById("mushafPage");
    var html = '<div class="ayat-flow">';
    var lastSurah = null;
    var revealedCount = 0;

    entries.forEach(function(a){
      if (a.surahNumber !== lastSurah){
        lastSurah = a.surahNumber;
        html += '<div class="surah-banner">' +
          '<div class="name">سُورَةُ ' + a.surahName + '</div>' +
          '<div class="meta">' +
            '<span class="badge">' + (a.revelationType === "Meccan" ? "Makkiyah" : "Madaniyah") + '</span>' +
            ' &nbsp;•&nbsp; ' + a.numberOfAyahsInSurah + ' ayat' +
          '</div>' +
        '</div>';
        if (a.surahNumber !== 9 && a.numberInSurah === 1){
          html += '<div class="basmalah">' + BASMALAH + '</div>';
        }
      }

      var numDigits = toArabicDigits(a.numberInSurah);
      var endMark = a.text.indexOf(AYAH_END_MARK) !== -1 ? "" : '<span class="num">' + numDigits + '</span>';
      var sajdaTag = a.sajda ? '<span class="sajda-tag">سجدة</span>' : "";

      var words = splitWords(a.text);
      html += '<span class="ayah-group">';
      words.forEach(function(w, idx){
        var wordId = a.globalNumber + "_" + idx;
        var isLast = idx === words.length - 1;
        var isRevealed = !!revealedWords[wordId];
        html += '<span class="word' + (isRevealed ? " revealed" : "") + '" data-w="' + wordId + '">' +
                  w + (isLast ? endMark + sajdaTag : "") +
                '</span> ';
      });
      html += '</span> ';
    });

    html += '</div><div class="page-number">— ' + toArabicDigits(pageNo) + ' —</div>';
    container.innerHTML = html;

    container.querySelectorAll(".word").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.w;
        if (revealedWords[id]) delete revealedWords[id]; else revealedWords[id] = true;
        el.classList.toggle("revealed");
        updateStatus();
      });
    });

    document.getElementById("pageInput").value = pageNo;
    document.getElementById("prevPage").disabled = pageNo <= 1;
    document.getElementById("nextPage").disabled = pageNo >= TOTAL_PAGES;

    var firstEntrySurah = entries.length ? entries[0].surahNumber : null;
    if (firstEntrySurah) highlightActiveSurah(firstEntrySurah);

    updateStatus();
    if (!skipHistoryTrack) reader.scrollTop = 0;
  }

  function updateStatus(){
    var entries = pages[currentPage] || [];
    var totalWords = 0, revealedCount = 0;
    entries.forEach(function(a){
      var words = splitWords(a.text);
      totalWords += words.length;
      words.forEach(function(w, idx){
        if (revealedWords[a.globalNumber + "_" + idx]) revealedCount++;
      });
    });
    document.getElementById("pageStatus").textContent =
      "Halaman " + currentPage + " dari " + TOTAL_PAGES + " — " + revealedCount + "/" + totalWords + " kata tampil";
    var surahNames = [];
    entries.forEach(function(a){
      if (surahNames.indexOf(a.surahName) === -1) surahNames.push(a.surahName);
    });
    document.getElementById("surahStatus").textContent = surahNames.join(" · ");
  }

  function goToPage(n){
    renderPage(n);
  }

  // ---------------- navigation controls ----------------
  document.getElementById("prevPage").addEventListener("click", function(){ goToPage(currentPage - 1); });
  document.getElementById("nextPage").addEventListener("click", function(){ goToPage(currentPage + 1); });
  document.getElementById("goPage").addEventListener("click", function(){
    var v = parseInt(document.getElementById("pageInput").value, 10);
    if (!isNaN(v)) goToPage(Math.min(TOTAL_PAGES, Math.max(1, v)));
  });
  document.getElementById("pageInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("goPage").click();
  });
  document.getElementById("toggleSidebar").addEventListener("click", function(){
    shell.classList.toggle("collapsed");
  });

  // ---------------- font settings ----------------
  document.getElementById("fontSelect").addEventListener("change", function(e){
    document.documentElement.style.setProperty("--ayah-font", e.target.value);
  });
  document.getElementById("fontSize").addEventListener("input", function(e){
    document.documentElement.style.setProperty("--ayah-size", e.target.value + "px");
    document.getElementById("fontSizeLabel").textContent = e.target.value + "px";
  });

  // ---------------- keyboard: space to reveal, backspace to undo ----------------
  var revealOrder = []; // stack of wordIds revealed via spacebar, for undo

  document.addEventListener("keydown", function(e){
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input") return;

    if (e.code === "Space"){
      e.preventDefault();
      var ids = getPageWordIds(currentPage);
      for (var i = 0; i < ids.length; i++){
        var id = ids[i];
        if (!revealedWords[id]){
          revealedWords[id] = true;
          revealOrder.push(id);
          renderPage(currentPage, true);
          return;
        }
      }
    } else if (e.key === "Backspace"){
      e.preventDefault();
      var last = revealOrder.pop();
      if (last !== undefined){
        delete revealedWords[last];
        renderPage(currentPage, true);
      }
    } else if (e.key === "ArrowRight"){
      goToPage(currentPage + 1);
    } else if (e.key === "ArrowLeft"){
      goToPage(currentPage - 1);
    }
  });

  // collapse sidebar by default on small screens
  if (window.innerWidth <= 760){
    shell.classList.add("collapsed");
    document.getElementById("fontSize").value = 20;
    document.getElementById("fontSizeLabel").textContent = "20px";
    document.documentElement.style.setProperty("--ayah-size", "20px");
  }

  loadData();
})();
</script>
</body>
</html>

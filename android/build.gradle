// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Capacitor 7+ modules target Java 21; this machine's JAVA_HOME may be older.
// The foojay resolver (settings.gradle) lets Gradle auto-provision a matching
// JDK into ~/.gradle/jdks — no system-wide Java install needed.
// Android modules apply JavaBasePlugin (not JavaPlugin), which still provides
// the `java` extension whose toolchain the JavaCompile tasks pick up.
subprojects {
    plugins.withType(JavaBasePlugin) {
        java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

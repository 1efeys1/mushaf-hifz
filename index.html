<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mushaf Hifz — Alat Bantu Hafalan Qur'an</title>
<!-- UI chrome fonts only (buttons/labels) — loaded from the web if available, harmless if
     offline since the CSS below already falls back to system sans-serif/serif for these. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button class="chip" id="toggleSidebar" title="Daftar surah">☰&#xFE0E; <span class="btn-label">Surah</span></button>
  <div class="brand">
    <span class="ar">مُصْحَفُ الْحِفْظِ</span>
    <span class="lat">Mushaf Hifz</span>
  </div>
  <span id="surahStatus" class="topbar-status"></span>
  <div class="nav-controls">
    <div class="page-jump">
      <span class="pj-label">Halaman</span>
      <input type="number" id="pageInput" min="1" max="604" value="1">
      <span class="pj-label">/ 604</span>
    </div>
  </div>
  <button class="chip" id="toggleSettings" title="Pengaturan">&#9881;&#xFE0E;</button>
</header>

  <div class="edge-fabs">
    <button class="edge-fab" id="fabSidebar" type="button" title="Daftar surah">☰&#xFE0E;</button>
    <button class="edge-fab" id="fabSettings" type="button" title="Pengaturan">&#9881;&#xFE0E;</button>
  </div>

<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tabSurah" type="button">Surah</button>
        <button class="sidebar-tab" id="tabBookmarks" type="button">Markah</button>
      </div>
      <input type="text" id="surahSearch" placeholder="Cari surah… (nama, nomor)">
      <div class="ayah-jump" id="ayahJumpRow">
        <span class="aj-label">Ayat ke-</span>
        <input type="number" id="ayahJumpInput" min="1" placeholder="—">
        <button id="ayahJumpBtn" type="button" title="Lompat ke ayat">&#10140;&#xFE0E;</button>
        <span class="aj-target" id="ayahJumpTarget"></span>
      </div>
    </div>
    <div class="surah-list" id="surahList"></div>
    <div class="markah-panel" id="markahPanel">
      <div class="markah-subtabs">
        <button class="markah-subtab active" id="subtabBookmarks" type="button">Markah <span class="tab-count" id="bookmarkCount"></span></button>
        <button class="markah-subtab" id="subtabNotes" type="button">Catatan <span class="tab-count" id="noteCount"></span></button>
      </div>
      <div class="bookmark-list" id="bookmarkList"></div>
      <div class="note-list" id="noteList"></div>
    </div>
  </aside>

  <main class="reader" id="reader">
    <div class="center-screen" id="loadingScreen">
      <div class="ar">جَارٍ التَحْمِيل…</div>
    </div>
  </main>

  <aside class="settings-panel" id="settingsPanel">
    <div class="settings-head">
      <span>Pengaturan</span>
      <button class="settings-close" id="settingsClose" type="button" title="Tutup">✕</button>
    </div>

    <div class="settings-group">
      <div class="settings-label">Tampilan</div>
      <div class="segmented" id="viewBySegmented">
        <button type="button" id="viewByMushaf">Mushaf</button>
        <button type="button" id="viewByAyat">Per Ayat</button>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-label">Konten</div>
      <label class="check-row"><input type="checkbox" id="contentArabic"><span>Arab</span></label>
      <label class="check-row"><input type="checkbox" id="contentTranslation"><span>Terjemahan</span></label>
      <label class="check-row"><input type="checkbox" id="contentWordGloss"><span>Terjemahan per kata</span></label>
      <label class="check-row"><input type="checkbox" id="contentTajweed"><span>Tajwid</span></label>
    </div>

    <div class="settings-group">
      <div class="settings-label">Ukuran</div>
      <div class="slider-row">
        <span class="slider-name">Arab</span>
        <input type="range" id="arabicSizeSlider" min="0.5" max="2.5" step="0.01" value="1">
        <span class="slider-value" id="fontSizeLabel">100%</span>
      </div>
      <div class="slider-row">
        <span class="slider-name">Terjemahan</span>
        <input type="range" id="translationSizeSlider" min="0.5" max="2.5" step="0.01" value="1">
        <span class="slider-value" id="translationSizeLabel">100%</span>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-label">Hint kata</div>
      <label class="check-row slider-row">
        <span class="slider-name">Kata pertama tiap ayat</span>
        <select id="hintWordSelect">
          <option value="0">Off</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
    </div>
  </aside>

  <div class="audio-bar" id="audioBar">
    <button class="audio-bar-head" id="audioBarToggle" type="button">
      <span class="ab-title">&#128266; Mishary Rashid Alafasy</span>
      <span class="ab-chevron" id="audioBarChevron">&#9650;</span>
    </button>
    <div class="audio-panel" id="audioPanel">
      <label class="check-row"><input type="checkbox" id="tapPlayToggle"><span>Putar audio saat ayat dibuka</span></label>
      <label class="check-row"><input type="checkbox" id="syncRevealToggle"><span>Buka kata otomatis mengikuti bacaan</span></label>
      <label class="check-row"><input type="checkbox" id="autoScrollToggle"><span>Scroll otomatis mengikuti bacaan</span></label>
      <div class="ab-row">
        <select id="rangeSurah" title="Surah"></select>
        <span class="ab-field">ayat</span>
        <input type="number" id="rangeFrom" min="1" title="Dari ayat">
        <span class="ab-field">–</span>
        <input type="number" id="rangeTo" min="1" title="Sampai ayat">
      </div>
      <div class="ab-row">
        <span class="ab-field">ulang</span>
        <select id="rangeRepeat" title="Jumlah ulang"></select>
        <select id="rangeRepeatMode" title="Cara mengulang"></select>
        <span class="ab-field">speed</span>
        <select id="rangeSpeed" title="Kecepatan"></select>
      </div>
      <div class="ab-row ab-controls">
        <button id="rangePlay" type="button" title="Putar rentang">&#9654; Putar</button>
        <button id="rangePause" type="button" title="Jeda / lanjut">&#10073;&#10073;</button>
        <button id="rangeReplay" type="button" title="Ulangi ayat ini dari awal">&#8635; Ayat</button>
        <button id="rangeStop" type="button" title="Berhenti">&#9724;</button>
        <span class="ab-status" id="rangeStatus"></span>
      </div>
      <div class="ab-credit">Reciter: Mishary Rashid Alafasy &middot; Audio kata: CDN Quran.com</div>
    </div>
  </div>
</div>

<script src="surah-meta.js"></script>
<script src="ayah-page.js"></script>
<script src="quran-api.js"></script>
<script src="page-layout.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
